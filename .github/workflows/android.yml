name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Restore persistent signing keystore
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        mkdir -p ~/.android
        if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
          echo "Restoring persistent keystore from RELEASE_KEYSTORE_BASE64 repository secret..."
          echo "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > debug.keystore
        elif [ -f debug.keystore.base64 ]; then
          echo "Restoring persistent keystore from committed debug.keystore.base64..."
          cat debug.keystore.base64 | tr -d '\r\n ' | base64 --decode > debug.keystore
        fi
        if [ -f debug.keystore ]; then
          cp debug.keystore ~/.android/debug.keystore
          cp debug.keystore app/debug.keystore
          echo "Keystore successfully configured."
        fi

    - name: Build & assemble APK
      run: |
        chmod +x gradlew || true
        ./gradlew assembleDebug assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace

    - name: Verify APK signing certificate
      run: |
        APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
        echo "Using apksigner: $APKSIGNER"
        if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "--- DEBUG APK SIGNATURE ---"
          $APKSIGNER verify --print-certs app/build/outputs/apk/debug/app-debug.apk
        fi
        if [ -f app/build/outputs/apk/release/app-release.apk ]; then
          echo "--- RELEASE APK SIGNATURE ---"
          $APKSIGNER verify --print-certs app/build/outputs/apk/release/app-release.apk
        fi

    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: ReplyFloatAi-apks
        path: |
          app/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/release/*.apk
        if-no-files-found: warn
