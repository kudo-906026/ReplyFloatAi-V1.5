name: Build Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
      GRADLE_OPTS: "-Djava.awt.headless=true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Environment, Keystore and Google Services
        run: |
          touch .env
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p app
          if [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"100840725760","project_id":"replyfloatai-project","storage_bucket":"replyfloatai-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:100840725760:android:a1b2c3d4e5f6g7h8","android_client_info":{"package_name":"com.aistudio.replyfloatai.kvrptq"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildValidationOnly"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace -Djava.awt.headless=true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReplyFloatAi-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
